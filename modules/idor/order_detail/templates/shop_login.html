{% extends "vuln4all/base.html" %}
{% block title %}登录 - {{ VULN.info.name }}{% endblock %}

{% block content %}
<h1>我的订单 · 登录</h1>

{% if error %}<p class="err">{{ error }}</p>{% endif %}

<form method="post" action="{{ url_for('login') }}">
  <p><label>用户名<br><input type="text" name="username" value="alice"></label></p>
  <p><label>密码<br><input type="text" name="password" value="alice123"></label></p>
  <p><button type="submit" class="btn">登录</button></p>
</form>

<p class="muted">
  演示账号：<span class="mono">alice / alice123</span> ·
  <span class="mono">bob / bob123</span>
</p>
<p class="muted">两个账号各有一批订单。你只该看到自己的。</p>
{% endblock %}
