[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln4all"
version = "0.1.0"
description = "模块化 Web 漏洞靶场 —— 丢一个模块进去，就多一道题"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "guaidao2" }]
dependencies = [
    "Flask>=2.2",
]

[project.optional-dependencies]
dev = [
    "paramiko>=3.0",
    "requests>=2.28",
]

[project.scripts]
vuln4all = "vuln4all.cli:main"

[tool.setuptools]
packages = ["vuln4all"]

[tool.setuptools.package-data]
vuln4all = ["templates/**/*.html", "static/*"]
